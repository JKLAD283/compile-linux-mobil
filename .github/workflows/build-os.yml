name: Build Mobile Linux Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu build-essential libncurses-dev git

    - name: Download Linux Kernel Source
      run: |
        git clone --depth 1 --branch linux-6.1.y https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git

    - name: Configure Kernel
      run: |
        cd linux
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig

    - name: Compile Kernel
      run: |
        cd linux
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image

    - name: Upload Kernel Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mobile-linux-kernel-image
        path: linux/arch/arm64/boot/Image
